<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riso Dot-Pixel</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#09060f;color:#f2ecff;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;box-shadow:0 0 60px #000a}
#panel{position:fixed;right:0;top:0;bottom:0;width:300px;overflow:auto;padding:16px;background:rgba(18,10,32,.9);backdrop-filter:blur(8px);border-left:1px solid #ffffff22;z-index:5}
#panel.hide{display:none}
h1{margin:0 0 4px;font-size:18px;letter-spacing:.5px;color:#ff2fa0}
h2{margin:16px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#19e6ff}
p{margin:0 0 4px;color:#cfc4ea}
small{display:block;margin-bottom:10px;color:#8f84ad}
label{display:block;margin:9px 0}
label span{display:flex;justify-content:space-between;margin-bottom:3px}
b{color:#3dffb0;font-weight:600}
input[type=range]{width:100%;accent-color:#ff2fa0}
input[type=color]{width:100%;height:26px;border:0;background:none;padding:0}
select{width:100%;padding:5px;background:#2a1b50;color:#fff;border:1px solid #ffffff33;border-radius:4px}
button{width:100%;margin:4px 0;padding:8px;background:#2b2060;color:#fff;border:0;border-radius:4px;font:inherit;cursor:pointer}
button:hover{background:#ff2fa0}
button.on{background:#19e6ff;color:#111}
button:disabled{opacity:.4;cursor:not-allowed}
.row2{display:flex;gap:6px}
.row2 button{margin:4px 0}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0}
.chk input{width:16px;height:16px}
#status{min-height:14px;color:#8f84ad;font-size:10.5px;margin:4px 0 2px}
#drop{position:fixed;inset:0;background:#000000aa;display:none;align-items:center;justify-content:center;font-size:22px;color:#fff;z-index:9;pointer-events:none}
#drop.show{display:flex}
#rec{position:fixed;left:16px;top:14px;color:#ff2f2f;font-weight:700;letter-spacing:.1em;display:none;z-index:6}
#rec.show{display:block}
.hint{margin-top:12px;color:#8f84ad;font-size:11px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="rec">● REC</div>
<div id="drop">Drop video to load</div>
<div id="panel"></div>
<input id="file" type="file" accept="video/*" style="display:none">
<script>
// ===================== SETTINGS =====================
const SLIDERS = [
  { id: 'dotSize',   label: 'Dot Size',          min: 3,  max: 30,  step: 1,  value: 9   },
  { id: 'pixShape',  label: 'Pixel Shape',       min: 0,  max: 20,  step: 1,  value: 12  },
  { id: 'ink',       label: 'Ink Intensity',     min: 0,  max: 100, step: 1,  value: 55  },
  { id: 'sep',       label: 'Color Separation',  min: 0,  max: 20,  step: 1,  value: 4   },
  { id: 'thresh',    label: 'Contrast / Threshold', min: 0, max: 100, step: 1, value: 50 },
  { id: 'strength',  label: 'Effect Strength',   min: 0,  max: 100, step: 1,  value: 100 },
  { id: 'speed',     label: 'Animation Speed',   min: 0,  max: 200, step: 5,  value: 100 },
  { id: 'grain',     label: 'Grain',             min: 0,  max: 100, step: 1,  value: 25  },
  { id: 'hoverRadius', label: 'Hover Radius (px)', min: 50, max: 600, step: 10, value: 220 },
];
const COLORS = {
  primary:   { bg: '#1b1030', c1: '#5a2a6b', c2: '#ff2fa0', c3: '#3dffb0' },
  secondary: { bg: '#0b2a6b', c1: '#19e6ff', c2: '#e8ff2f', c3: '#ff6a1a' },
};
const LOOP = 8, REC_SECONDS = 5, TAU = Math.PI * 2, MAX_CELLS = 16000, FEATHER = 36;
const ASPECTS = { '16:9': 16 / 9, '9:16': 9 / 16, '1:1': 1, '4:5': 4 / 5, 'Fit window': 0 };

// ===================== STATE =====================
const S = {}, C = { primary: {}, secondary: {} };
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const panel = document.getElementById('panel'), recBadge = document.getElementById('rec');
const dropHint = document.getElementById('drop'), statusEl = () => document.getElementById('status');
let demoTime = 0, last = performance.now(), paused = false, recording = false;
let aspect = '16:9', W = 1, H = 1, dpr = 1, cell = 9, cols = 1, rows = 1;
let activeSource = 'demo', videoLoaded = false;
let hoverActive = false, hoverX = 0, hoverY = 0, hoverEnabled = true;
const refs = {}, colorRefs = {};
let pauseBtn, recBtn, demoBtn, videoBtn;

const video = document.createElement('video');
video.loop = true; video.muted = true; video.playsInline = true;

const demoCanvas = document.createElement('canvas'), demoCtx = demoCanvas.getContext('2d');
const gridCanvas = document.createElement('canvas'), gridCtx = gridCanvas.getContext('2d', { willReadFrequently: true });
const fxCanvas = document.createElement('canvas'), fxCtx = fxCanvas.getContext('2d');
const maskCanvas = document.createElement('canvas'), maskCtx = maskCanvas.getContext('2d');
const noiseCanvas = document.createElement('canvas'), noiseCtx = noiseCanvas.getContext('2d');
let noiseCounter = 0;

function resetValues() {
  SLIDERS.forEach(s => (S[s.id] = s.value));
  C.primary = { ...COLORS.primary };
  C.secondary = { ...COLORS.secondary };
}
resetValues();

// ===================== SETUP =====================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const avail = { w: innerWidth - (panel.classList.contains('hide') ? 0 : 300), h: innerHeight };
  const ww = Math.max(avail.w, 240), wh = avail.h;
  const ar = ASPECTS[aspect] || ww / wh;
  let cw = ww, ch = cw / ar;
  if (ch > wh) { ch = wh; cw = ch * ar; }
  cw = Math.floor(cw); ch = Math.floor(ch);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  W = canvas.width = Math.round(cw * dpr);
  H = canvas.height = Math.round(ch * dpr);
  fxCanvas.width = W; fxCanvas.height = H;
  demoCanvas.width = 220; demoCanvas.height = Math.round(220 * H / W);
  maskCanvas.width = Math.round((600 + FEATHER) * 2 * dpr);
  maskCanvas.height = maskCanvas.width;
  noiseCanvas.width = 96; noiseCanvas.height = 96;
}

function drawCover(targetCtx, media, mw, mh, dw, dh) {
  if (!mw || !mh) return;
  const s = Math.max(dw / mw, dh / mh);
  const w = mw * s, h = mh * s;
  targetCtx.drawImage(media, (dw - w) / 2, (dh - h) / 2, w, h);
}

// ===================== UPDATE =====================
function update(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) demoTime += dt * (S.speed / 100);
}

// procedural morphing blob field -> feeds the shared risograph pipeline
function drawDemo() {
  const w = demoCanvas.width, h = demoCanvas.height, ph = (demoTime % LOOP) / LOOP * TAU;
  demoCtx.fillStyle = '#7a7a7a';
  demoCtx.fillRect(0, 0, w, h);
  demoCtx.filter = 'blur(14px)';
  const bx = w * (0.5 + 0.22 * Math.cos(ph)), by = h * (0.5 + 0.18 * Math.sin(ph * 1.0));
  let g = demoCtx.createRadialGradient(bx, by, 0, bx, by, w * 0.42);
  g.addColorStop(0, '#fff'); g.addColorStop(1, '#7a7a7a00');
  demoCtx.fillStyle = g;
  demoCtx.beginPath(); demoCtx.arc(bx, by, w * 0.42, 0, TAU); demoCtx.fill();
  const sx = w * (0.5 + 0.3 * Math.cos(ph * 1.6 + 2)), sy = h * (0.5 + 0.28 * Math.sin(ph * 1.3 + 1));
  g = demoCtx.createRadialGradient(sx, sy, 0, sx, sy, w * 0.22);
  g.addColorStop(0, '#dcdcdc'); g.addColorStop(1, '#7a7a7a00');
  demoCtx.fillStyle = g;
  demoCtx.beginPath(); demoCtx.arc(sx, sy, w * 0.22, 0, TAU); demoCtx.fill();
  demoCtx.filter = 'none';
}

// ===================== DRAW (shared risograph pipeline) =====================
function dotPath(x, y, r, shapeK) {
  if (r <= 0) return;
  if (shapeK >= 1) { ctx._p.moveTo(x + r, y); ctx._p.arc(x, y, r, 0, TAU); }
  else if (shapeK <= 0) ctx._p.rect(x - r, y - r, 2 * r, 2 * r);
  else if (fxCtx.roundRect) ctx._p.roundRect(x - r, y - r, 2 * r, 2 * r, r * shapeK);
  else ctx._p.rect(x - r, y - r, 2 * r, 2 * r);
}

// posterize luminance into 4 ink levels (0=bg .. 3=lightest)
function computeLevels(data, n) {
  const levels = new Uint8Array(n);
  const bias = (50 - S.thresh) / 100 * 0.45;
  const b1 = Math.min(0.92, Math.max(0.08, 0.33 + bias));
  const b2 = Math.min(0.94, Math.max(b1 + 0.05, 0.52 + bias));
  const b3 = Math.min(0.97, Math.max(b2 + 0.05, 0.70 + bias));
  const k = 1 + (S.ink / 100) * 1.6;
  for (let i = 0; i < n; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], bl = data[i * 4 + 2];
    let L = (0.299 * r + 0.587 * g + 0.114 * bl) / 255;
    L = Math.min(1, Math.max(0, 0.5 + (L - 0.5) * k));
    levels[i] = L < b1 ? 0 : L < b2 ? 1 : L < b3 ? 2 : 3;
  }
  return levels;
}

// draw the 4-tone risograph layers for a cell range into targetCtx
function paintTones(targetCtx, pal, levels, i0, i1, j0, j1, ox, oy) {
  targetCtx.fillStyle = pal.bg;
  targetCtx.fillRect(ox, oy, (i1 - i0) * cell, (j1 - j0) * cell);
  const shapeK = S.pixShape / 20, sepPx = S.sep * dpr;
  const baseR = cell * 0.5 * (0.5 + 0.55 * (S.ink / 100));
  const colors = [pal.c1, pal.c2, pal.c3];
  for (let layer = 0; layer < 3; layer++) {
    const dx = sepPx * (layer - 1), dy = sepPx * 0.4 * (layer - 1);
    targetCtx.fillStyle = colors[layer];
    const p = new Path2D();
    ctx._p = p;
    for (let j = j0; j < j1; j++) {
      for (let i = i0; i < i1; i++) {
        if (levels[j * cols + i] === layer + 1) {
          const x = (i + 0.5) * cell + ox - i0 * cell + dx;
          const y = (j + 0.5) * cell + oy - j0 * cell + dy;
          dotPath(x, y, baseR, shapeK);
        }
      }
    }
    targetCtx.fill(p);
  }
}

function drawGrain(targetCtx) {
  if (S.grain <= 0) return;
  if (noiseCounter++ % 4 === 0) {
    const id = noiseCtx.createImageData(96, 96);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = Math.random() * 255;
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
    }
    noiseCtx.putImageData(id, 0, 0);
  }
  targetCtx.save();
  targetCtx.globalAlpha = (S.grain / 100) * 0.35;
  targetCtx.globalCompositeOperation = 'overlay';
  const pat = targetCtx.createPattern(noiseCanvas, 'repeat');
  targetCtx.fillStyle = pat;
  targetCtx.fillRect(0, 0, W, H);
  targetCtx.restore();
}

function renderFrame(skipHover) {
  const media = activeSource === 'video' && videoLoaded ? video : demoCanvas;
  const mw = media === video ? video.videoWidth : demoCanvas.width;
  const mh = media === video ? video.videoHeight : demoCanvas.height;

  cell = Math.max(2, S.dotSize) * dpr;
  while ((W / cell) * (H / cell) > MAX_CELLS) cell *= 1.08;
  cols = Math.max(1, Math.ceil(W / cell)); rows = Math.max(1, Math.ceil(H / cell));

  gridCanvas.width = cols; gridCanvas.height = rows;
  gridCtx.imageSmoothingEnabled = true;
  if (mw && mh) drawCover(gridCtx, media, mw, mh, cols, rows);
  let levels;
  try { levels = computeLevels(gridCtx.getImageData(0, 0, cols, rows).data, cols * rows); }
  catch (e) { levels = new Uint8Array(cols * rows); }

  fxCtx.clearRect(0, 0, W, H);
  paintTones(fxCtx, C.primary, levels, 0, cols, 0, rows, 0, 0);

  if (hoverEnabled && hoverActive && !skipHover) {
    const scale = canvas.width / canvas.getBoundingClientRect().width || dpr;
    const devR = S.hoverRadius * scale, devF = FEATHER * scale;
    const bx0 = Math.max(0, hoverX - devR - devF), by0 = Math.max(0, hoverY - devR - devF);
    const bx1 = Math.min(W, hoverX + devR + devF), by1 = Math.min(H, hoverY + devR + devF);
    if (bx1 > bx0 && by1 > by0) {
      const i0 = Math.max(0, Math.floor(bx0 / cell)), i1 = Math.min(cols, Math.ceil(bx1 / cell));
      const j0 = Math.max(0, Math.floor(by0 / cell)), j1 = Math.min(rows, Math.ceil(by1 / cell));
      const mw2 = (i1 - i0) * cell, mh2 = (j1 - j0) * cell;
      maskCanvas.width = Math.max(1, Math.ceil(mw2));
      maskCanvas.height = Math.max(1, Math.ceil(mh2));
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      paintTones(maskCtx, C.secondary, levels, i0, i1, j0, j1, 0, 0);
      const mcx = hoverX - i0 * cell, mcy = hoverY - j0 * cell;
      maskCtx.globalCompositeOperation = 'destination-in';
      const grad = maskCtx.createRadialGradient(mcx, mcy, Math.max(0, devR - devF), mcx, mcy, devR);
      grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#fff0');
      maskCtx.fillStyle = grad;
      maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
      maskCtx.globalCompositeOperation = 'source-over';
      fxCtx.drawImage(maskCanvas, i0 * cell, j0 * cell);
    }
  }
  drawGrain(fxCtx);

  ctx.clearRect(0, 0, W, H);
  if (mw && mh) drawCover(ctx, media, mw, mh, W, H);
  ctx.globalAlpha = S.strength / 100;
  ctx.drawImage(fxCanvas, 0, 0);
  ctx.globalAlpha = 1;
}

// ===================== INPUT =====================
function pointerToCanvas(e) {
  const r = canvas.getBoundingClientRect(), sx = canvas.width / r.width, sy = canvas.height / r.height;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
canvas.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hoverActive = true; });
canvas.addEventListener('pointerleave', () => { hoverActive = false; });
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') { hoverActive = true; canvas.setPointerCapture(e.pointerId); }
  const p = pointerToCanvas(e); hoverX = p.x; hoverY = p.y;
});
canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') hoverActive = false; });
canvas.addEventListener('pointercancel', () => { hoverActive = false; });
canvas.addEventListener('pointermove', e => {
  const p = pointerToCanvas(e); hoverX = p.x; hoverY = p.y;
  if (e.pointerType === 'mouse') hoverActive = true;
});

function togglePause() {
  paused = !paused;
  pauseBtn.textContent = (paused ? 'Play' : 'Pause') + ' (Space)';
  if (videoLoaded) paused ? video.pause() : video.play().catch(() => {});
}
function randomize() {
  SLIDERS.forEach(s => {
    if (s.id === 'hoverRadius') return;
    const n = Math.round((s.max - s.min) / s.step);
    S[s.id] = +(s.min + Math.floor(Math.random() * (n + 1)) * s.step).toFixed(4);
  });
  syncUI();
}
function resetAll() { resetValues(); syncUI(); }
function toggleHide() { panel.classList.toggle('hide'); resize(); }

window.addEventListener('keydown', e => {
  const t = e.target, tag = t.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const acts = { ' ': togglePause, r: randomize, s: savePNG, v: record, h: toggleHide };
  const fn = acts[e.key.toLowerCase()];
  if (fn) { e.preventDefault(); fn(); }
});
window.addEventListener('resize', resize);

function setSource(src) {
  if (src === 'video' && !videoLoaded) return;
  activeSource = src;
  demoBtn.classList.toggle('on', src === 'demo');
  videoBtn.classList.toggle('on', src === 'video');
  if (src === 'video' && !paused) video.play().catch(() => {});
}

function loadVideoFile(file) {
  if (!file || !file.type.startsWith('video/')) { statusEl().textContent = 'Unsupported file — showing demo.'; return; }
  statusEl().textContent = 'Loading video…';
  const url = URL.createObjectURL(file);
  video.src = url;
  video.onloadeddata = () => {
    videoLoaded = true; videoBtn.disabled = false;
    statusEl().textContent = 'Playing your video.';
    setSource('video');
    if (!paused) video.play().catch(() => {});
  };
  video.onerror = () => { statusEl().textContent = "Couldn't load that file — showing demo."; videoLoaded = false; };
}

['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
window.addEventListener('dragenter', e => { e.preventDefault(); dropHint.classList.add('show'); });
window.addEventListener('dragleave', e => { if (e.target === document.body || e.relatedTarget === null) dropHint.classList.remove('show'); });
window.addEventListener('drop', e => { dropHint.classList.remove('show'); if (e.dataTransfer.files[0]) loadVideoFile(e.dataTransfer.files[0]); });

// ===================== UI =====================
function syncUI() {
  SLIDERS.forEach(s => { refs[s.id].input.value = S[s.id]; refs[s.id].out.textContent = S[s.id]; });
  Object.keys(C.primary).forEach(k => (colorRefs.primary[k].value = C.primary[k]));
  Object.keys(C.secondary).forEach(k => (colorRefs.secondary[k].value = C.secondary[k]));
}

function buildUI() {
  panel.innerHTML = `<h1>Riso Dot-Pixel</h1>
    <p>Hover-reveal risograph pixel art for your music reels.</p>
    <small>Designed by Palak</small>
    <button id="uploadBtn">Upload Video</button>
    <div class="row2"><button id="demoBtn">Demo</button><button id="videoBtn" disabled>My Video</button></div>
    <div id="status"></div>
    <label><span>Canvas size</span><select id="asp">${Object.keys(ASPECTS).map(k => `<option${k === aspect ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" id="hoverToggle" checked> Hover Color Effect</label>
    <h2>Effect</h2><div id="sl"></div>
    <h2>Primary Palette</h2><div id="co1"></div>
    <h2>Hover Palette</h2><div id="co2"></div>
    <h2>Actions</h2><div id="bt"></div>
    <p class="hint">8-second perfect loop. H hides this panel. Drag a video in anytime.</p>`;

  document.getElementById('uploadBtn').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = e => e.target.files[0] && loadVideoFile(e.target.files[0]);
  demoBtn = document.getElementById('demoBtn'); demoBtn.onclick = () => setSource('demo');
  videoBtn = document.getElementById('videoBtn'); videoBtn.onclick = () => setSource('video');
  setSource('demo');

  const asp = panel.querySelector('#asp');
  asp.onchange = () => { aspect = asp.value; resize(); asp.blur(); };

  const hoverToggle = document.getElementById('hoverToggle');
  hoverToggle.onchange = () => (hoverEnabled = hoverToggle.checked);

  SLIDERS.forEach(s => {
    const row = document.createElement('label');
    row.innerHTML = `<span>${s.label}<b></b></span><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}">`;
    const input = row.querySelector('input'), out = row.querySelector('b');
    input.oninput = () => { S[s.id] = +input.value; out.textContent = input.value; };
    refs[s.id] = { input, out };
    panel.querySelector('#sl').appendChild(row);
  });

  colorRefs.primary = {}; colorRefs.secondary = {};
  ['primary', 'secondary'].forEach((group, gi) => {
    Object.keys(COLORS[group]).forEach(k => {
      const row = document.createElement('label');
      row.innerHTML = `<span>${k}</span><input type="color" value="${COLORS[group][k]}">`;
      const input = row.querySelector('input');
      input.oninput = () => (C[group][k] = input.value);
      colorRefs[group][k] = input;
      panel.querySelector(gi ? '#co2' : '#co1').appendChild(row);
    });
  });

  const btns = [['Pause (Space)', togglePause], ['Randomize (R)', randomize], ['Reset', resetAll],
                ['Save PNG (S)', savePNG], ['Record 5s video (V)', record]];
  btns.forEach(([text, fn], i) => {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => { fn(); b.blur(); };
    if (i === 0) pauseBtn = b;
    if (i === 4) recBtn = b;
    panel.querySelector('#bt').appendChild(b);
  });
  syncUI();
}

// ===================== EXPORT =====================
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function savePNG() {
  renderFrame(true); // skip hover so no stationary circle is baked in
  canvas.toBlob(b => b && download(b, 'riso-dot-pixel.png'));
}

function record() {
  if (recording || !window.MediaRecorder) { statusEl().textContent = 'Recording not supported here.'; return; }
  const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  let rec;
  try { rec = new MediaRecorder(canvas.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : {}); }
  catch (e) { statusEl().textContent = 'Could not start recording.'; return; }
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    recording = false; recBadge.classList.remove('show');
    const mime = rec.mimeType || 'video/webm';
    download(new Blob(chunks, { type: mime }), 'riso-dot-pixel.' + (mime.includes('mp4') ? 'mp4' : 'webm'));
  };
  rec.start();
  recording = true; recBadge.classList.add('show');
  setTimeout(() => rec.state !== 'inactive' && rec.stop(), REC_SECONDS * 1000);
}

// ===================== START =====================
function frame(now) {
  update(now);
  if (activeSource === 'demo') drawDemo();
  renderFrame(false);
  requestAnimationFrame(frame);
}
resize();
buildUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
